<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Passport Photo Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>US Passport Photo AI</h1>
        <div id="aiStatus" class="status-box">Loading AI Models...</div>

        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/*" disabled>
            <label for="imageInput" class="btn">Upload Photo</label>
        </div>

        <div id="validationResults" class="validation-grid"></div>

        <div class="editor-wrap">
            <img id="imageToCrop" style="display:none;">
        </div>

        <div class="controls" id="controls" style="display:none;">
            <button id="generateBtn" class="btn primary">Generate 300 DPI Print Sheet</button>
        </div>

        <div class="requirements-list">
            <h4>USCIS Requirements Check:</h4>
            <ul>
                <li>2x2 inches (51x51mm)</li>
                <li>White/Off-white background</li>
                <li>Neutral expression (No "awkward" faces)</li>
                <li>Eyes open and visible</li>
                <li>No glasses or headgear</li>
            </ul>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- Face API Library -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
