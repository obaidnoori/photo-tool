<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCIS Passport Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Passport Photo Assistant</h1>
            <div id="aiStatus" class="status-pill">System Initializing...</div>
        </header>

        <main class="editor-grid">
            <section class="upload-area">
                <div class="actions">
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <button class="btn-primary" onclick="document.getElementById('imageInput').click()">Upload Photo</button>
                    <button class="btn-secondary" id="zoomIn">＋</button>
                    <button class="btn-secondary" id="zoomOut">－</button>
                </div>
                
                <div class="cropper-container">
                    <img id="imagePreview">
                    <div id="guideOverlay" class="guide-overlay">
                        <div class="head-stencil"></div>
                    </div>
                </div>
            </section>

            <aside class="sidebar">
                <div class="card settings-card">
                    <h3>Exemptions</h3>
                    <label><input type="checkbox" id="isInfant" onchange="updateWorkflow()"> Infant (Under 2yr)</label><br>
                    <label><input type="checkbox" id="isReligious" onchange="updateWorkflow()"> Religious Attire</label>
                </div>

                <div class="card checklist-card">
                    <h3>Requirement Check</h3>
                    <ul id="checklist">
                        <li id="check-face" class="pending">Face Forward / Pose</li>
                        <li id="check-ratio" class="pending">Head Size (50-69%)</li>
                        <li id="check-color" class="pending">Full Color</li>
                        <li id="check-bg" class="pending">White Background</li>
                        <li id="check-quality" class="pending">Image Quality (Blur/Res)</li>
                    </ul>
                </div>

                <div class="card preview-card">
                    <h3>4x6 Print Sheet</h3>
                    <div class="canvas-wrapper">
                        <canvas id="cvsPreview"></canvas>
                    </div>
                    <button id="downloadBtn" class="btn-success" disabled>Download Print Sheet</button>
                </div>
            </aside>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
