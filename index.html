<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Passport Photo Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">US Passport AI</div>
            <div id="aiStatus" class="status-pill">Loading AI Models...</div>
        </header>

        <main class="main-content">
            <section class="editor-section">
                <div class="upload-wrapper">
                    <input type="file" id="imageInput" accept="image/*">
                    <label for="imageInput" class="btn-main" id="uploadLabel">1. Upload Photo</label>
                </div>

                <div class="cropper-container">
                    <img id="imageToCrop">
                </div>

                <div class="cvs-preview-area">
                    <h3>CVS 4x6 Print Preview</h3>
                    <div class="canvas-frame">
                        <canvas id="cvsPreview"></canvas>
                    </div>
                </div>
            </section>

            <aside class="sidebar">
                <div class="card checklist-card">
                    <h4>USCIS Requirements</h4>
                    <ul id="checklist">
                        <li id="check-face" class="pending">Face Detected</li>
                        <li id="check-neutral" class="pending">Neutral Expression</li>
                        <li id="check-eyes" class="pending">Eyes Open</li>
                    </ul>
                </div>

                <div class="card download-card">
                    <button id="downloadBtn" class="btn-download" disabled>Download 300 DPI Sheet</button>
                    <p class="specs-text">Output: 1800x1200px (4x6 inch)</p>
                </div>
            </aside>
        </main>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
